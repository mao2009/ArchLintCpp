name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libclang-18-dev clang-18 ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test CLI
        run: ./build/archlint-cpp --version

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 and Ninja
        run: brew install llvm@18 ninja

      - name: Configure
        shell: bash
        run: |
          prefix="$(brew --prefix llvm@18)"
          cmake -S . -B build -G Ninja \
            -DLLVM_DIR="$prefix/lib/cmake/llvm" \
            -DClang_DIR="$prefix/lib/cmake/clang" \
            -DCMAKE_CXX_COMPILER="$prefix/bin/clang++" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test CLI
        run: ./build/archlint-cpp --version
