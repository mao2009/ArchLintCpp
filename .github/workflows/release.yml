name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-13
            artifact: macos-x86_64
          - os: windows-2022
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libclang-18-dev clang-18 ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@18 ninja

      - name: Install LLVM/Clang 18 (Windows)
        if: runner.os == 'Windows'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: llvm18
          create-args: >-
            llvmdev=18.1.8
            clangdev=18.1.8
            ninja

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          prefix="$(brew --prefix llvm@18)"
          sdkroot="$(xcrun --sdk macosx --show-sdk-path)"
          cmake -S . -B build -G Ninja \
            -DLLVM_DIR="$prefix/lib/cmake/llvm" \
            -DClang_DIR="$prefix/lib/cmake/clang" \
            -DCMAKE_C_COMPILER="$prefix/bin/clang" \
            -DCMAKE_CXX_COMPILER="$prefix/bin/clang++" \
            -DCMAKE_OSX_SYSROOT="$sdkroot" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash -el {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DLLVM_DIR="$CONDA_PREFIX/Library/lib/cmake/llvm" \
            -DClang_DIR="$CONDA_PREFIX/Library/lib/cmake/clang" \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage"

      - name: Build, test, and install
        shell: bash
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cmake --install build

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="ArchLintCpp-${GITHUB_REF_NAME}-${{ matrix.artifact }}.tar.gz"
          tar -C stage -czf "$archive" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "ArchLintCpp-${env:GITHUB_REF_NAME}-${{ matrix.artifact }}.zip"
          Compress-Archive -Path "stage\*" -DestinationPath $archive
          (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower() + "  " + $archive | Set-Content -NoNewline -Path "$archive.sha256"
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE=$archive"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
