site_name: ArchLintCpp
site_description: Architecture and dependency linter for modern C++ projects powered by Clang.
site_url: https://mao2009.github.io/ArchLintCpp/
repo_url: https://github.com/mao2009/ArchLintCpp
repo_name: mao2009/ArchLintCpp
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Real-world usage:
      - PSXRecompStudio: examples/psxrecompstudio.md
  - GitHub: https://github.com/mao2009/ArchLintCpp
  - Releases: https://github.com/mao2009/ArchLintCpp/releases

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search

copyright: Copyright &copy; 2026 mao2009
